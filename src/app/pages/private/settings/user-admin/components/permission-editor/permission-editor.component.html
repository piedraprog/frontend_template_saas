<div class="permission-editor">
  <p-accordion [multiple]="true">
    @for (group of permissionGroups(); track group.name; let i = $index) {
      <p-accordion-panel [value]="i.toString()">
        <p-accordion-header>
          <div class="flex align-items-center gap-3 w-full">
            <!-- Icono del grupo -->
            @if (group.icon) {
              <i [class]="group.icon + ' text-primary text-xl'"></i>
            }

            <!-- Información del grupo -->
            <div class="flex flex-column gap-1 flex-1">
              <span class="font-bold text-900">{{ group.name }}</span>
              @if (group.description) {
                <small class="text-600 font-normal">{{ group.description }}</small>
              }
            </div>

            <!-- Toggle del grupo -->
            <div
              class="ml-auto mr-3"
              (click)="$event.stopPropagation()"
              (keydown)="$event.stopPropagation()"
              tabindex="0"
            >
              <p-toggleswitch
                [ngModel]="isGroupSelected(group.permissions)"
                (ngModelChange)="toggleGroup(group.permissions, $event)"
              />
            </div>
          </div>
        </p-accordion-header>
        <p-accordion-content>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 pt-4">
            @for (perm of group.permissions; track perm.value) {
              <div class="field-checkbox flex align-items-center gap-2 p-3 border-round surface-50">
                <div class="flex flex-column gap-1 flex-1">
                  <label
                    [for]="'perm-' + perm.value"
                    class="font-medium cursor-pointer select-none text-900"
                  >
                    {{ perm.label }}
                  </label>
                  <small class="text-600 block">{{ perm.description }}</small>
                </div>
                <p-toggleswitch
                  [ngModel]="hasPermission(perm.value)"
                  (ngModelChange)="togglePermission(perm.value, $event)"
                  [inputId]="'perm-' + perm.value"
                />
              </div>
            }
          </div>
        </p-accordion-content>
      </p-accordion-panel>
    }
  </p-accordion>
</div>
