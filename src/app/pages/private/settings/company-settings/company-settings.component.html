<p-toast position="top-right" styleClass="app-toast-stack" [life]="5200" />

<div class="mx-auto flex w-full max-w-5xl flex-col gap-4">
  <app-page-header
    title="Empresa"
    icon="pi pi-building"
    subtitle="Administra los datos básicos de la organización que se reutilizan en el panel."
  />

  @if (loading()) {
    <section class="rounded-lg border border-slate-200 bg-white p-5 shadow-admin-card">
      <div class="flex items-center gap-3 text-sm font-semibold text-slate-600">
        <i class="pi pi-spin pi-spinner text-primary"></i>
        Cargando información de la empresa
      </div>
    </section>
  } @else {
    <section class="rounded-lg border border-slate-200 bg-white shadow-admin-card">
      <div class="border-b border-slate-100 px-5 py-4">
        <h2 class="m-0 text-base font-bold text-slate-900">Datos públicos</h2>
        <p class="m-0 mt-1 text-sm text-slate-600">
          Mantén esta información consistente con la identidad comercial de la organización.
        </p>
      </div>

      <div class="grid gap-5 p-5 md:grid-cols-2" [formGroup]="form">
        <div class="flex flex-col gap-2">
          <label for="cname" class="text-sm font-bold text-slate-800">Nombre comercial</label>
          <input pInputText id="cname" formControlName="name" class="w-full" />
        </div>

        <div class="flex flex-col gap-2">
          <label for="clogo" class="text-sm font-bold text-slate-800">
            URL o ruta del logotipo
          </label>
          <textarea
            pTextarea
            id="clogo"
            formControlName="logo"
            rows="3"
            class="w-full"
            placeholder="https://... o ruta servida por tu CDN"
          ></textarea>
        </div>
      </div>
    </section>

    <div class="flex flex-wrap justify-end gap-3">
      <p-button label="Cancelar" severity="secondary" [outlined]="true" routerLink=".." />
      <p-button
        label="Guardar"
        icon="pi pi-check"
        (onClick)="save()"
        [loading]="saving()"
        [disabled]="saving()"
      />
    </div>
  }
</div>
