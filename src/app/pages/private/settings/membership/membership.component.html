<div class="membership-shell">
  <nav class="membership-toolbar" aria-label="Navegación de configuración">
    <a routerLink=".." class="membership-toolbar-link">
      <i class="pi pi-arrow-left" aria-hidden="true"></i>
      Configuración
    </a>
  </nav>

  <app-page-header title="Gestión de membresía" icon="pi pi-crown"></app-page-header>

  <p class="membership-lead">
    Consulta tu plan actual, límites de uso y opciones para mejorar cuando integres la pasarela de
    pagos.
  </p>

  <div class="membership-cards">
    <section class="membership-card">
      <div class="membership-card-head">
        <div class="membership-card-title">
          <i class="pi pi-briefcase" aria-hidden="true"></i>
          <h3>Plan actual</h3>
        </div>
      </div>
      <div class="membership-card-body">
        <app-current-plan-card
          [plan]="currentPlan()"
          [subscription]="currentSubscription()"
          [usage]="usage()"
          (upgradePlan)="handleUpgradePlan()"
        />
      </div>
    </section>

    <!-- T5: Addons ocultos hasta integrar pasarela (Stripe/NowPayments). Descomentar cuando esté listo. -->

      <div class="membership-card-head">

          <i class="pi pi-plus-circle"></i>
          <h3>Complementos disponibles</h3>
        </div>
        <span class="membership-badge">Potencia tu plan</span>
      </div>
      <div class="membership-card-body">
        <app-addon-list
          [addons]="availableAddons()"

      </div>
    </section>
    -->

    <app-view-plans-modal
      [visible]="showViewPlansModal()"
      (visibleChange)="showViewPlansModal.set($event)"
    />
  </div>
</div>
