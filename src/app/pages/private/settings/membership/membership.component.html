<div class="settings-page">
  <!-- Header con botón volver -->
  <app-page-header title="Gestión de Membresía" icon="pi pi-crown"></app-page-header>

  <!-- Contenido Principal -->
  <div class="profile-container">
    <!-- Current Plan Section -->
    <section class="profile-card">
      <div class="card-header">
        <div class="card-title">
          <i class="pi pi-briefcase"></i>
          <h3>Plan Actual</h3>
        </div>
      </div>
      <div class="card-content">
        <app-current-plan-card
          [plan]="currentPlan()"
          [subscription]="currentSubscription()"
          [usage]="usage()"
          (upgradePlan)="handleUpgradePlan()"
        />
      </div>
    </section>

    <!-- T5: Addons ocultos hasta integrar pasarela (Stripe/NowPayments). Descomentar cuando esté listo. -->

          <h3>Complementos Disponibles</h3>
        </div>
        <span class="badge">Potencia tu plan</span>
      </div>
      <div class="card-content">
        <app-addon-list
          [addons]="availableAddons()"

        ></app-addon-list>
      </div>
    </section>
    -->

    <!-- T6: Modal Ver planes obtiene lista desde GET /plans (plansService.getPlans), no desde el summary -->
    <app-view-plans-modal
      [visible]="showViewPlansModal()"
      (visibleChange)="showViewPlansModal.set($event)"
    />
  </div>
</div>
