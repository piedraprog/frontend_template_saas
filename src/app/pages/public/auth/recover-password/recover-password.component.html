<p-toast position="top-right" styleClass="app-toast-stack" [life]="5200" />

<app-auth-card
  [title]="'Recuperar contraseña'"
  [subheader]="'Escribe el correo asociado a tu cuenta y te guiaremos con el siguiente paso.'"
>
  <form [formGroup]="recoveryForm" (ngSubmit)="recoveryPassword()" class="space-y-5" #form="ngForm">
    <div class="rounded-lg border border-slate-200 bg-slate-50 p-4">
      <div class="flex gap-3">
        <span
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-700"
        >
          <i class="pi pi-envelope"></i>
        </span>
        <p class="text-sm leading-6 text-slate-600">
          Validaremos el correo y enviaremos las instrucciones de recuperación si existe una cuenta
          asociada.
        </p>
      </div>
    </div>

    <div class="space-y-2">
      <div class="flex items-center justify-between gap-3">
        <label for="email" class="text-sm font-bold text-slate-800">Correo electrónico</label>
        <small
          *ngIf="
            (recoveryForm.get('email')?.invalid && recoveryForm.get('email')?.touched) ||
            form.submitted
          "
          class="text-right text-xs font-semibold text-red-600"
        >
          <span *ngIf="recoveryForm.get('email')?.errors?.['required']">Campo obligatorio</span>
          <span *ngIf="recoveryForm.get('email')?.errors?.['email']">Correo inválido</span>
        </small>
      </div>
      <input
        pInputText
        id="email"
        aria-describedby="email-help"
        formControlName="email"
        placeholder="correo@empresa.com"
        class="auth-input"
        [invalid]="
          !!recoveryForm.get('email')?.invalid &&
          (recoveryForm.get('email')?.touched || form.submitted)
        "
      />
    </div>

    <div class="grid gap-3 pt-2 sm:grid-cols-2">
      <a
        routerLink="/login"
        class="auth-button-secondary inline-flex items-center text-sm font-bold no-underline"
      >
        Volver al login
      </a>
      <p-button
        type="submit"
        label="Enviar instrucciones"
        severity="contrast"
        styleClass="auth-button text-sm"
        class="w-full"
      />
    </div>
  </form>
</app-auth-card>

<p-confirmDialog />
