<p-toast position="top-right" styleClass="app-toast-stack" [life]="5200" />

<app-auth-card
  [title]="'Iniciar sesión'"
  [subheader]="'Ingresa con tus credenciales para continuar al panel administrativo.'"
>
  <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-5" #form="ngForm">
    <div class="space-y-2">
      <div class="flex items-center justify-between gap-3">
        <label for="email" class="text-sm font-bold text-slate-800">Correo electrónico</label>
        <small
          *ngIf="
            (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) || form.submitted
          "
          class="text-right text-xs font-semibold text-red-600"
        >
          <span *ngIf="loginForm.get('email')?.errors?.['required']">Campo obligatorio</span>
          <span *ngIf="loginForm.get('email')?.errors?.['email']">Correo inválido</span>
        </small>
      </div>
      <input
        pInputText
        id="email"
        aria-describedby="email-help"
        formControlName="email"
        placeholder="correo@empresa.com"
        class="auth-input"
        [invalid]="
          !!loginForm.get('email')?.invalid && (loginForm.get('email')?.touched || form.submitted)
        "
      />
    </div>

    <div class="space-y-2">
      <div class="flex items-center justify-between gap-3">
        <label for="password" class="text-sm font-bold text-slate-800">Contraseña</label>
        <small
          *ngIf="
            (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) ||
            form.submitted
          "
          class="text-right text-xs font-semibold text-red-600"
        >
          <span *ngIf="loginForm.get('password')?.errors?.['required']">Campo obligatorio</span>
        </small>
      </div>
      <div class="flex gap-2">
        <input
          pInputText
          id="password"
          aria-describedby="password-help"
          formControlName="password"
          [type]="passwordVisible ? 'text' : 'password'"
          placeholder="Ingresa tu contraseña"
          class="auth-input"
          [invalid]="
            !!loginForm.get('password')?.invalid &&
            (loginForm.get('password')?.touched || form.submitted)
          "
        />
        <p-button
          [icon]="passwordVisible ? 'pi pi-eye-slash' : 'pi pi-eye'"
          [rounded]="true"
          [text]="true"
          severity="secondary"
          styleClass="auth-icon-button"
          (onClick)="passwordToggle()"
        />
      </div>
    </div>

    <div class="flex items-center justify-between gap-4 text-sm">
      <span class="text-slate-500">¿Olvidaste tu contraseña?</span>
      <a routerLink="/recovery" class="auth-link">Recuperar contraseña</a>
    </div>

    <div class="grid gap-3 pt-2 sm:grid-cols-2">
      <a
        routerLink="/register"
        class="auth-button-secondary inline-flex items-center text-sm font-bold no-underline"
      >
        Crear cuenta
      </a>
      <p-button
        type="submit"
        label="Iniciar sesión"
        severity="contrast"
        styleClass="auth-button text-sm"
        class="w-full"
      />
    </div>
  </form>
</app-auth-card>
