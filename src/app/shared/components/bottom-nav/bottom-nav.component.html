<nav class="bottom-nav">
  @for (item of navItems(); track item.id) {
    @if (item.route) {
      <a
        class="nav-item"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: false }"
        [attr.data-tour]="'mobile-navigation-' + item.id"
        pRipple
      >
        <span class="nav-icon-wrapper">
          @if (item.badge && item.badge > 0) {
            <i [class]="item.icon" pBadge [value]="item.badge.toString()"></i>
          } @else {
            <i [class]="item.icon"></i>
          }
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    } @else {
      <button
        class="nav-item"
        [class.active]="isActive(item)"
        [class.nav-item-quick-action]="item.id.includes('quick-action')"
        [attr.data-tour]="'mobile-navigation-' + item.id"
        (click)="onItemClick(item, $event)"
        pRipple
        type="button"
      >
        <span class="nav-icon-wrapper">
          @if (item.badge && item.badge > 0) {
            <i [class]="item.icon" pBadge [value]="item.badge.toString()"></i>
          } @else {
            <i [class]="item.icon"></i>
          }
        </span>
        <span class="nav-label">{{ item.label }}</span>
      </button>
    }
  }

  <button
    class="nav-profile"
    (click)="toggleProfile($event)"
    type="button"
    pRipple
    [attr.aria-label]="hasUnseenHelp() ? 'Perfil, 1 nueva' : 'Perfil de usuario'"
  >
    <span class="nav-profile-avatar-wrap">
      <p-avatar
        [label]="(userData().username.charAt(0) || 'U').toUpperCase()"
        shape="circle"
        size="normal"
        styleClass="profile-avatar"
      />
      @if (hasUnseenHelp()) {
        <span class="admin-help-unseen-dot admin-help-unseen-dot--profile" aria-hidden="true"></span>
      }
    </span>
  </button>
</nav>

<p-popover #notificationsPopover styleClass="notifications-popover" [appendTo]="'body'">
  <app-notifications-panel
    [visible]="showNotificationsPanel()"
    (closePanel)="closeNotifications()"
  />
</p-popover>

<p-popover #profilePopover styleClass="profile-popover" [appendTo]="'body'">
  <div class="profile-menu">
    <div class="profile-header">
      <p-avatar
        [label]="(userData().username.charAt(0) || 'U').toUpperCase()"
        shape="circle"
        size="large"
        styleClass="profile-avatar-large"
      />
      <div class="profile-info">
        <p class="profile-name">{{ userData().username }}</p>
        <p class="profile-email">{{ userData().email }}</p>
      </div>
    </div>
    <div class="profile-actions">
      <button
        type="button"
        class="profile-action-item"
        data-tour="mobile-navigation-whats-new"
        (click)="openWhatsNew($event)"
      >
        <i class="pi pi-sparkles" aria-hidden="true"></i>
        <span>Novedades</span>
        @if (hasUnseenHelp()) {
          <span class="admin-help-unseen-dot" aria-hidden="true"></span>
          <span class="sr-only">Nuevo</span>
        }
      </button>
      <button
        type="button"
        class="profile-action-item"
        data-tour="mobile-navigation-help"
        (click)="openHelp($event)"
      >
        <i class="pi pi-question-circle" aria-hidden="true"></i>
        <span>Ayuda</span>
      </button>
      <a
        [routerLink]="['settings', 'profile']"
        class="profile-action-item"
        (click)="closeProfile()"
      >
        <i class="pi pi-user"></i>
        <span>Mi Perfil</span>
      </a>
      <a
        routerLink="settings"
        class="profile-action-item"
        data-tour="mobile-navigation-settings"
        (click)="closeProfile()"
      >
        <i class="pi pi-cog"></i>
        <span>Ajustes</span>
      </a>
      <button type="button" class="profile-action-item profile-action-logout" (click)="onLogout()">
        <i class="pi pi-sign-out"></i>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </div>
</p-popover>
